 background:linear-gradient(180deg,#54392d 0%,#3a281f 55%,#2e2019 100%);border-bottom:1px solid var(--edge);

.b:disabled{opacity:.6}
.cell{display:flex;align-items:center;gap:5px;height:25px;padding:0 9px 0 3px;border-radius:13px;border:1px solid var(--edge);

#v{touch-action:pan-y pinch-zoom;overscroll-behavior:contain;position:absolute;top:0;bottom:0;left:0;right:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:8px 10px 30px;scrollbar-color:#4f8a63 #0f2a1c}

#v.fh img{height:calc(100vh - var(--bh,50px) - 40px);height:calc(100dvh - var(--bh,50px) - 40px);width:auto}
img#pg{display:block;transition:opacity .18s;margin-top:-3.9%;mix-blend-mode:multiply}
#rib{position:absolute;top:0;right:32px;width:21px;height:42px;background-size:contain;background-repeat:no-repeat;pointer-events:none;display:none;z-index:2}
#sh{position:fixed;inset:0;background:rgba(5,16,10,.72);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);z-index:10;display:none;align-items:center;justify-content:center;padding:12px}

.sw i.s{border-color:#fff;transform:scale(1.18)}

.sq{margin-bottom:4px}
.row{display:flex;gap:7px;justify-content:center;margin-top:7px;flex-wrap:wrap}
.li,.su{display:flex;align-items:center;gap:8px;padding:2px 7px;border-bottom:1px solid rgba(227,203,133,.16);cursor:pointer;border-radius:10px}

.pn>div{display:flex;flex-direction:column;flex:1;min-height:0;overflow:auto}

.pn>div>*{flex:none}.pn>div>.sl{flex:1 1 auto}
.pn .b{height:25px;padding:0 10px;font-size:12.5px}

</style>
</head>

let newer=false,busy=false;
function drawVer(){const b=$('ver');b.className=newer?'new':'';b.disabled=busy;b.textContent=busy?t('updating'):newer?t('update'):'v'+VER}
async function hardRefresh(){
  newer=false;busy=true;drawVer();
  try{const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister()))}catch(e){}
  try{const ks=await caches.keys();await Promise.all(ks.filter(k=>k!=='img-'+IMGV).map(k=>caches.delete(k)))}catch(e){}
  const u=new URL(location.href);u.searchParams.set('u',Date.now());location.replace(u.toString());
}
async function checkVer(){
  try{const r=await fetch('./version.json?'+Date.now(),{cache:'no-store'});if(!r.ok)return;const j=await r.json();
    const n=!!j.v&&j.v!==VER;if(n!==newer){newer=n;drawVer();if(n){toast(t('update_toast'));showBar()}}}catch(e){}
}
$('ver').onclick=async()=>{if(newer)return hardRefresh();await checkVer();toast(newer?t('update_toast'):t('latest',{v:VER}))};
