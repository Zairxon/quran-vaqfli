$('sr').onclick=()=>{
  const w=el('div');w.appendChild(el('h3',null,'Суры'));
  const q=el('input','sq');q.type='text';q.placeholder='Поиск: введите 1–3 буквы или номер';q.autocomplete='off';q.setAttribute('autocapitalize','off');w.appendChild(q);
  const lst=el('div','sl');w.appendChild(lst);
  const here=PM[cur-1]||[];
  function fill(){
    const k=norm(q.value.trim());lst.innerHTML='';let n=0;
    for(let i=1;i<=114;i++){
      if(k&&!(String(i).startsWith(k)||words(UZ[i-1]).some(x=>x.startsWith(k))||words(RU[i-1]).some(x=>x.startsWith(k))))continue;
      const r=el('div','su'+(here.includes(i)?' cu':''));
      r.appendChild(el('div','no',String(i)));
      const nm=el('div','nm');nm.appendChild(el('b',null,UZ[i-1]));nm.appendChild(el('small',null,RU[i-1]));r.appendChild(nm);
      r.appendChild(el('div','pg','стр. '+START[i-1]));
      r.onclick=()=>{close();show(START[i-1])};lst.appendChild(r);n++;
    }
    if(!n)lst.appendChild(el('div','em','Ничего не найдено'));
  }
  q.oninput=fill;fill();
  const r=el('div','row');const cn=el('button','b','Закрыть');cn.onclick=close;r.appendChild(cn);w.appendChild(r);
  open(w);setTimeout(()=>{const c=lst.querySelector('.cu');if(c)c.scrollIntoView({block:'center'})},50);
};
const s0=+lg('qp',1)||1;show(s0);if(s0>1)toast('Продолжаем со стр. '+s0);
let newer=false,busy=false;
function drawVer(){const b=$('ver');b.className=newer?'new':'';b.disabled=busy;b.textContent=busy?'Обновляю…':newer?'Есть обновление — обновить':'Версия '+VER}
async function hardRefresh(){
  newer=false;busy=true;drawVer();
  try{const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister()))}catch(e){}
  try{const ks=await caches.keys();await Promise.all(ks.filter(k=>k!=='img-'+IMGV).map(k=>caches.delete(k)))}catch(e){}
  const u=new URL(location.href);u.searchParams.set('u',Date.now());location.replace(u.toString());
}
async function checkVer(){
  try{const r=await fetch('./version.json?'+Date.now(),{cache:'no-store'});if(!r.ok)return;const j=await r.json();
    const n=!!j.v&&j.v!==VER;if(n!==newer){newer=n;drawVer();if(n)toast('Есть обновление')}}catch(e){}
}
$('ver').onclick=async()=>{if(newer)return hardRefresh();await checkVer();toast(newer?'Есть обновление':'Версия '+VER+' — последняя')};
drawVer();checkVer();setInterval(checkVer,5*60e3);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkVer()});
addEventListener('pagehide',()=>sv('qp',cur));
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js?i='+IMGV).catch(()=>{});
</script>
</body>
