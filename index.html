function toast(m){tt.textContent=m;tt.style.opacity=1;clearTimeout(toast.h);toast.h=setTimeout(()=>tt.style.opacity=0,1800)}
function draw(){
  const m=marks[cur];
  rib.style.display=m?'block':'none';
  if(m)rib.style.backgroundImage=ribbon(COL[m.c]);
  mk.style.background=m?COL[m.c]:'';mk.style.borderColor=m?'#fff':'';
  cm.hidden=!(m&&m.t);cm.textContent=m?m.t:'';
  $('srt').textContent=(PM[cur-1]||[]).map(s=>UZ[s-1]).join(' · ');
}
function show(i){
  cur=Math.max(1,Math.min(N,i|0||1));
  img.style.opacity=.3;img.onload=()=>img.style.opacity=1;img.src=src(cur);
  img.style.marginTop=NOCROP.includes(cur)?'0':'';
  v.scrollTop=0;inp.value=cur;sv('qp',cur);draw();
  if(cur<N)new Image().src=src(cur+1);
  if(cur>1)new Image().src=src(cur-1);
}
inp.onchange=()=>show(+inp.value);
inp.onfocus=()=>inp.select();
$('prev').onclick=()=>show(cur-1);
$('next').onclick=()=>show(cur+1);
$('ft').onclick=()=>{fit=fit==='w'?'h':'w';v.className=fit==='h'?'fh':'fw';sv('qf',fit);v.scrollTop=0;toast(fit==='w'?'По ширине':'Целая страница')};
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='ArrowRight'||e.key==='PageDown')show(cur+1);if(e.key==='ArrowLeft'||e.key==='PageUp')show(cur-1)});
let sx=null,sy=0,stt=0;
v.addEventListener('touchstart',e=>{if(e.touches.length!==1){sx=null;return}sx=e.touches[0].clientX;sy=e.touches[0].clientY;stt=Date.now()},{passive:true});
v.addEventListener('touchend',e=>{if(sx===null)return;const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;sx=null;
  if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.6&&Date.now()-stt<700)show(cur+(dx<0?1:-1))},{passive:true});
function open(node){pn.innerHTML='';pn.appendChild(node);sh.classList.add('on')}
function close(){sh.classList.remove('on')}
sh.addEventListener('click',e=>{if(e.target===sh)close()});
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function saveMarks(){sv('qbm',JSON.stringify(marks))}
mk.onclick=()=>{
  const m=marks[cur];let sel=m?m.c:0;
  const w=el('div');w.appendChild(el('h3',null,'Метка — стр. '+cur));
  const sw=el('div','sw');
  COL.forEach((c,i)=>{const d=el('i',i===sel?'s':'');d.style.background=c;d.onclick=()=>{sel=i;[...sw.children].forEach((x,j)=>x.classList.toggle('s',j===i))};sw.appendChild(d)});
  w.appendChild(sw);
  const t=el('input');t.type='text';t.placeholder='Комментарий, например: имя суры';t.maxLength=80;t.value=m?m.t:'';w.appendChild(t);
  const r=el('div','row');
  const ok=el('button','b','Сохранить');ok.onclick=()=>{marks[cur]={c:sel,t:t.value.trim()};saveMarks();draw();close();toast('Метка сохранена')};
  r.appendChild(ok);
  if(m){const del=el('button','b','Удалить');del.onclick=()=>{delete marks[cur];saveMarks();draw();close();toast('Метка удалена')};r.appendChild(del)}
  const cn=el('button','b','Закрыть');cn.onclick=close;r.appendChild(cn);
  w.appendChild(r);
  const ks=Object.keys(marks).map(Number).sort((a,b)=>a-b);
  w.appendChild(el('div','sub','Мои метки'+(ks.length?' · '+ks.length:'')));
  const lst=el('div','sl');
  if(!ks.length)lst.appendChild(el('div','em','Пока меток нет'));
  ks.forEach(p=>{const mm=marks[p],row=el('div','li'+(p===cur?' cu':''));const i=el('i');i.style.background=COL[mm.c];row.appendChild(i);row.appendChild(el('b',null,'стр. '+p));row.appendChild(el('span',null,mm.t||''));row.onclick=()=>{close();show(p)};lst.appendChild(row)});
  w.appendChild(lst);open(w);
};
const norm=s=>s.toLowerCase().replace(/['’ʼ‘`ʻ]/g,'').replace(/ё/g,'е');
const words=s=>norm(s).split(/[\s\-]+/).filter(Boolean);
$('sr').onclick=()=>{
  const w=el('div');w.appendChild(el('h3',null,'Суры'));
  const q=el('input','sq');q.type='text';q.placeholder='Поиск: введите 1–3 буквы или номер';q.autocomplete='off';q.setAttribute('autocapitalize','off');w.appendChild(q);
  const lst=el('div','sl');w.appendChild(lst);
  const here=PM[cur-1]||[];
  function fill(){
    const k=norm(q.value.trim());lst.innerHTML='';let n=0;
    for(let i=1;i<=114;i++){
      if(k&&!(String(i).startsWith(k)||words(UZ[i-1]).some(x=>x.startsWith(k))||words(RU[i-1]).some(x=>x.startsWith(k))))continue;
      const r=el('div','su'+(here.includes(i)?' cu':''));
      r.appendChild(el('div','no',String(i)));
      const nm=el('div','nm');nm.appendChild(el('b',null,UZ[i-1]));nm.appendChild(el('small',null,RU[i-1]));r.appendChild(nm);
      r.appendChild(el('div','pg','стр. '+START[i-1]));
      r.onclick=()=>{close();show(START[i-1])};lst.appendChild(r);n++;
    }
    if(!n)lst.appendChild(el('div','em','Ничего не найдено'));
  }
  q.oninput=fill;fill();
  const r=el('div','row');const cn=el('button','b','Закрыть');cn.onclick=close;r.appendChild(cn);w.appendChild(r);
  open(w);setTimeout(()=>{const c=lst.querySelector('.cu');if(c)c.scrollIntoView({block:'center'})},50);
};
const s0=+lg('qp',1)||1;show(s0);if(s0>1)toast('Продолжаем со стр. '+s0);
let newer=false,busy=false;
function drawVer(){const b=$('ver');b.className=newer?'new':'';b.disabled=busy;b.textContent=busy?'Обновляю…':newer?'↻ Есть обновление':'v'+VER}
async function hardRefresh(){
  newer=false;busy=true;drawVer();
  try{const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister()))}catch(e){}
  try{const ks=await caches.keys();await Promise.all(ks.filter(k=>k!=='img-'+IMGV).map(k=>caches.delete(k)))}catch(e){}
  const u=new URL(location.href);u.searchParams.set('u',Date.now());location.replace(u.toString());
}
async function checkVer(){
  try{const r=await fetch('./version.json?'+Date.now(),{cache:'no-store'});if(!r.ok)return;const j=await r.json();
    const n=!!j.v&&j.v!==VER;if(n!==newer){newer=n;drawVer();if(n)toast('Есть обновление')}}catch(e){}
}
$('ver').onclick=async()=>{if(newer)return hardRefresh();await checkVer();toast(newer?'Есть обновление':'Версия '+VER+' — последняя')};
drawVer();checkVer();setInterval(checkVer,5*60e3);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkVer()});
addEventListener('pagehide',()=>sv('qp',cur));
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js?i='+IMGV).catch(()=>{});
</script>
</body>
